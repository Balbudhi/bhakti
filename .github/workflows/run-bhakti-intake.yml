name: Intake Bhakti Songs

on:
  workflow_dispatch:
    inputs:
      songs:
        description: "One publicly downloadable HTTPS media URL per line."
        required: true
      workers:
        description: "Independent song workers."
        required: true
        default: "7"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bhakti-intake
  cancel-in-progress: false

jobs:
  intake:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]"
          install -d /home/runner/.config/yt-dlp
          printf '%s\n' '--js-runtimes node' '--extractor-args youtube:player_client=web_embedded' > /home/runner/.config/yt-dlp/config
          node --version
          yt-dlp --version

      - name: Run production intake pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BHAKTI_GEMINI_PROVIDER: openrouter
          BHAKTI_WORKFLOW_SONGS: ${{ inputs.songs }}
          BHAKTI_WORKFLOW_WORKERS: ${{ inputs.workers }}
        run: |
          python3 - <<'PY'
          import os
          import ipaddress
          import shlex
          import socket
          import subprocess
          import sys
          from urllib.parse import urlparse

          lines = [line.strip() for line in os.environ["BHAKTI_WORKFLOW_SONGS"].splitlines() if line.strip()]
          if not lines:
              raise SystemExit("workflow input 'songs' is empty")
          if len(lines) > 50:
              raise SystemExit("a hosted intake run is limited to 50 songs")
          workers = int(os.environ["BHAKTI_WORKFLOW_WORKERS"])
          if not 1 <= workers <= 7:
              raise SystemExit("workers must be between 1 and 7")
          for line in lines:
              parsed = urlparse(line)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"only public HTTPS media URLs without embedded credentials are accepted: {line}")
              if len(line) > 4096 or parsed.hostname.casefold() == "localhost" or parsed.hostname.casefold().endswith(".local"):
                  raise SystemExit(f"local or malformed media URL is not accepted: {line}")
              addresses = socket.getaddrinfo(parsed.hostname, parsed.port or 443, type=socket.SOCK_STREAM)
              if not addresses or any(not ipaddress.ip_address(address[4][0].split("%", 1)[0]).is_global for address in addresses):
                  raise SystemExit(f"media URL must resolve only to public internet addresses: {line}")
          command = [
              "python3",
              "scripts/bhakti_pipeline.py",
              "--publish",
              "--workers",
              str(workers),
          ]
          for line in lines:
              command.extend(["--url", line])
          print("Running:", " ".join(shlex.quote(part) for part in command))
          raise SystemExit(subprocess.call(command))
          PY

      - name: Commit generated readers
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import subprocess

          changed = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all", "--", "data/songs.js", "songs"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed_names = {"data.js", "index.html", "audio.m4a", "audio.mp3", "audio.webm", "audio.ogg"}
          for row in changed:
              path = row[3:]
              if path == "data/songs.js" or (path.startswith("songs/") and path.rsplit("/", 1)[-1] in allowed_names):
                  subprocess.run(["git", "add", "--", path], check=True)
          PY
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Bhakti: publish workflow-ingested readers" \
            -m "Workflow-dispatched intake publishes and deploys without relying on a laptop."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
