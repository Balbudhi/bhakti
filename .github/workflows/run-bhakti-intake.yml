name: Intake Bhakti Songs

on:
  workflow_dispatch:
    inputs:
      songs:
        description: "One YouTube URL per line."
        required: true
      workers:
        description: "Independent song workers."
        required: true
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bhakti-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip yt-dlp

      - name: Run production intake pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BHAKTI_WORKFLOW_SONGS: ${{ inputs.songs }}
          BHAKTI_WORKFLOW_WORKERS: ${{ inputs.workers }}
        run: |
          python3 - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          lines = [line.strip() for line in os.environ["BHAKTI_WORKFLOW_SONGS"].splitlines() if line.strip()]
          if not lines:
              raise SystemExit("workflow input 'songs' is empty")
          command = [
              "python3",
              "scripts/bhakti_pipeline.py",
              "--publish",
              "--workers",
              os.environ["BHAKTI_WORKFLOW_WORKERS"],
          ]
          for line in lines:
              if line.startswith(("https://", "http://")):
                  command.extend(["--url", line])
              else:
                  command.extend(["--song", line])
          print("Running:", " ".join(shlex.quote(part) for part in command))
          raise SystemExit(subprocess.call(command))
          PY

      - name: Commit generated readers
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import subprocess

          changed = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all", "--", "data/songs.js", "songs"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed_names = {"data.js", "index.html", "audio.m4a", "audio.mp3", "audio.webm", "audio.ogg"}
          for row in changed:
              path = row[3:]
              if path == "data/songs.js" or (path.startswith("songs/") and path.rsplit("/", 1)[-1] in allowed_names):
                  subprocess.run(["git", "add", "--", path], check=True)
          PY
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Bhakti: publish workflow-ingested readers" \
            -m "Workflow-dispatched intake publishes and deploys without relying on a laptop."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
