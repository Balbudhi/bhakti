name: Deploy Bhakti to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bhakti-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assemble the published site
        run: python3 scripts/assemble_public_site.py
      - name: Check player and PWA contracts
        run: |
          node scripts/test_library_filters.js
          node scripts/test_library_search.js
          node scripts/test_lyric_search.js
          node scripts/test_search_ranking.js
          node scripts/test_queue_render.js
          node scripts/test_queue_drag_performance.js
          node scripts/test_reader_performance.js
          node scripts/test_reader_romanization.js
          node scripts/test_shuffle_worker.js
          node scripts/test_app_loading.js
          node scripts/test_all_line_seeks.js
          python3 scripts/test_naming.py
          python3 scripts/test_tag_taxonomy.py
          python3 scripts/test_reviewed_subject_tags.py
          python3 scripts/test_search_song_subjects.py
          python3 scripts/test_subject_metadata_refresh.py
          python3 scripts/test_editorial_text_revision.py
          python3 scripts/test_shuffle_profile_integration.py
          python3 scripts/test_hosted_public_assembly.py
          python3 scripts/test_song.py
          python3 scripts/test_song_check.py
          python3 scripts/audit_bhakti_contract.py
          python3 scripts/search_song_subjects.py --check
          python3 -m py_compile scripts/*.py
          node scripts/test_player_progress.js
          node scripts/test_player_keyboard.js
          node scripts/test_player_viewport.js
          node scripts/test_pwa_player_shell.js
          node scripts/test_media_session.js
          node scripts/test_mobile_zoom.js
          node scripts/test_pwa_lifecycle.js
          node scripts/test_queue_controls.js
          node scripts/test_smart_shuffle.js
          node scripts/test_shuffle_queue_integration.js
          node scripts/test_shuffle_app_integration.js
          node scripts/test_shuffle_assets.js
          node scripts/test_release_integrity.js
          python3 scripts/audit_shuffle_profiles.py
          node scripts/test_playback.js
          node scripts/test_playback_recovery.js
          node scripts/test_repeat_playback.js
          node scripts/test_view_transitions.js
          node scripts/test_visit.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = 1 ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "Multiple Pages artifacts found; start a fresh workflow run."
              exit 1
            fi
            sleep 2
          done
          echo "Pages artifact did not become visible within 60 seconds."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
