name: Deploy Bhakti to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bhakti-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the published site
        run: |
          set -euo pipefail
          # Allowlist, not denylist: the site publishes only what the reader
          # loads. Engineering docs, pipeline scripts, and review data stay in
          # the repository and off the web, so a new internal file is off the
          # site by default rather than by remembering to exclude it.
          mkdir -p _site/data
          cp -R assets songs _site/
          cp index.html manifest.webmanifest sw.js robots.txt sitemap.xml CNAME _site/
          cp data/songs.js _site/data/songs.js
          # Song directories publish the reader page and its data, nothing else.
          find _site/songs -type f ! -name index.html ! -name data.js -delete
          find _site/songs -mindepth 1 -type d -empty -delete
      - name: Verify no internal file reached the artifact
        run: |
          set -euo pipefail
          leaked=$(find _site \( -name 'AGENTS.md' -o -name 'README.md' -o -name '*.py' \
            -o -path '*/docs/*' -o -path '*/scripts/*' -o -name '.gitignore' \) -print)
          if [ -n "$leaked" ]; then
            echo "internal files present in the published artifact:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "published files: $(find _site -type f | wc -l)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
